# /nginx/nginx.conf

# 워커 프로세스 설정
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # 로그 포맷 상세 정의
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    server {
        # 80번 포트로 들어오는 요청을 수신
        listen 80;
        server_name localhost;

        # 사용자가 /api/products 또는 /api/products/로 요청했을 때
        location /api/products {
            # 1. 요청 경로 재작성: 
            #   /api/products 또는 /api/products/를 /products로 변경합니다.
            rewrite ^/api/products/?$ /products break;

            # 2. K8s 서비스 이름으로 프록시:
            #   'localhost'가 아닌 서비스 이름 'product-service'와 서비스 포트 '5000'번을 사용합니다.
            proxy_pass http://product-service:5050;

            # 프록시 설정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # [수정] 응답 헤더 추가: Nginx를 통과했음을 증명하는 헤더
            add_header X-Served-By "Nginx-Gateway-Pod-v2.0";
        }
    }
}