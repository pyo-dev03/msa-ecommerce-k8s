apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment-east
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
      release: east  # East 식별 라벨
  template:
    metadata:
      labels:
        app: product-service
        release: east
    spec:
      containers:
        - name: product-service-container
          image: vyjsjs/product-service:2.0
          ports:
            - name: http-flask   # West와 동일한 포트 이름 사용
              containerPort: 5050
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /products
              port: http-flask   # 포트 번호 대신 이름을 사용
            initialDelaySeconds: 10
            periodSeconds: 10