# Service: "클러스터 내부에서 'product-service'라는 이름으로 Pod에 접근하게 해줘"
apiVersion: v1
kind: Service
metadata:
  name: product-service # 서비스의 DNS 이름
spec:
  selector:
    app: product-service  # 'app: product-service' 라벨이 붙은 Pod와 연결
    release: west  # [초기 설정] 현재는 West 파드로만 트래픽 전송
  ports:
  - name: service-port  # 서비스 자체의 포트 이름 (선택 사항)
    protocol: TCP
    port: 5050  # 서비스가 5050번 포트로 요청을 받음
    targetPort: http-flask  # 포트번호가 아닌 파드에 정의된 'http-flask'라는 포트 이름을 찾아감